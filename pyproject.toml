[project]
name = "ipv6stats"
version = "1.0.0"
description = "IPv6 Statistics - a static site of global IPv6 adoption, rebuilt daily from collected data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.4",
    "plotly>=6.3.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "dnspython>=2.6.1",
    "pycountry>=24.6.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
