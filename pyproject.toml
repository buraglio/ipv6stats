[project]
name = "ipv6stats"
version = "1.0.0"
description = "IPv6 Statistics Dashboard - global IPv6 adoption metrics"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.20.0",
    "streamlit-folium>=0.25.1",
    "streamlit>=1.48.1",
    "trafilatura>=2.0.0",
    "requests>=2.32.4",
    "pandas>=2.3.1",
    "numpy>=2.3.2",
    "plotly>=6.3.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "dnspython>=2.6.1",
    "pycountry>=24.6.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
