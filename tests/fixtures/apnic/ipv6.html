    var setPref;
    function checkCookie() {
      var name = 'ipv6_zoom' + '=';
      var decodedCookie = decodeURIComponent(document.cookie);
      var ca = decodedCookie.split(';');
      console.log('all cookies:');
      console.log(ca)
      console.log('iterate cookies');
      for(var i = 0; i <ca.length; i++) {
        var c = ca[i];
        console.log(i+': '+ca[i])
        while (c.charAt(0) == ' ') c = c.substring(1);
        if (c.indexOf(name) == 0) {
          console.log(c)
          // Cookie found, check value
          var c_value = c.substring(name.length, c.length);
          console.log(c_value);
          if (c_value === "") {
            var checkBox = document.getElementById('zoom');
            if  (checkBox.checked == false) {
              return;
            }
          } else {
            if (c_value == 1) {
              console.log('redirecting'
);
              window.location.replace("https://stats.labs.apnic.net/ipv6-zoom");
              return;
            } // if exists and is 0, do nothing
          }
        }
      }
      // Cookie not found, set it
      setPrefs();
    }
    </script>
<script>
    function setCookie(page) {
      console.log("setPref is set to " + setPref);
      if (setPref == 1) {
        var date = new Date();
        date.setTime(date.getTime() + (7*24*60*60*1000)); // 7 days, that as long as safari will remember it anyway
        var expires = 'expires=' + date.toUTCString();
        document.cookie = 'ipv6_zoom=' + page + '; ' + expires + '; SameSite=Strict; path=/';
      } else {
          document.cookie = 'ipv6_zoom=; ' + expires + '; SameSite=Strict; path=/';
      }
    }
    </script>
<script type='text/javascript'>

        var checkBox = document.getElementById('zoom');
        if (checkBox.checked == true){
          setPref = 1;

        } else {
          setPref = 0;
          console.log('checkbox unchecked');
        }
        setCookie(0);
